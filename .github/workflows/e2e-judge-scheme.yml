name: E2E judge scheme

on:
  workflow_call:
    inputs:
      image:
        description: Image to verify the Scheme judge on
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The judge lives on the VUB's GitLab, not in dodona-edu.
      - name: Clone the judge
        run: git clone --depth 1 --branch master https://gitlab.soft.vub.ac.be/Structuur1/dodona-judge.git "$RUNNER_TEMP/judge"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the smoke test
        run: dodona-scheme/e2e/smoke-test "$RUNNER_TEMP/judge" "$IMAGE"
        env:
          IMAGE: ${{ inputs.image }}
