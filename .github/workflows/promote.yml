name: Promote

# Stages the candidate the E2E job already tested as :next, retagged rather
# than rebuilt, so what ships is bit for bit what was tested.

on:
  pull_request:
    types: [closed]

jobs:
  promote:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # No checkout: paths-filter reads the changed files from the API, and the
      # merge ref is gone once the pull request is closed.
      - name: Detect changed images
        uses: dorny/paths-filter@v4
        id: filter
        with:
          # Must match build.yml's promotedOnMerge list.
          filters: |
            html:
              - dodona-html.dockerfile
              - dodona-html/**
            python:
              - dodona-python.dockerfile
              - dodona-python/**

      - name: Log in to GHCR
        if: ${{ steps.filter.outputs.html == 'true' || steps.filter.outputs.python == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the tested html candidate to next
        if: ${{ steps.filter.outputs.html == 'true' }}
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/dodona-html
          CANDIDATE: pr-${{ github.event.pull_request.number }}
        run: |
          # {{.Manifest.Digest}} silently renders the whole output, not the digest.
          digest="$(docker buildx imagetools inspect "$IMAGE:$CANDIDATE" --format '{{json .Manifest}}' | jq -r '.digest')"
          echo "Promoting $IMAGE:$CANDIDATE ($digest) to $IMAGE:next"
          docker buildx imagetools create -t "$IMAGE:next" "$IMAGE@$digest"

      - name: Promote the tested python candidate to next
        if: ${{ steps.filter.outputs.python == 'true' }}
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/dodona-python
          CANDIDATE: pr-${{ github.event.pull_request.number }}
        run: |
          # {{.Manifest.Digest}} silently renders the whole output, not the digest.
          digest="$(docker buildx imagetools inspect "$IMAGE:$CANDIDATE" --format '{{json .Manifest}}' | jq -r '.digest')"
          echo "Promoting $IMAGE:$CANDIDATE ($digest) to $IMAGE:next"
          docker buildx imagetools create -t "$IMAGE:next" "$IMAGE@$digest"
