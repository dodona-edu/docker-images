name: Publish

# Moves :next to :latest, the tag the workers pull. :previous keeps the digest
# :latest pointed at before this run, so rolling back is retagging it.

on:
  workflow_dispatch:
    inputs:
      images:
        description: Images to publish, space or comma separated (empty publishes everything pending)
        type: string
        required: false
        default: ''
      dry_run:
        description: Only report what would be published
        type: boolean
        default: false

jobs:
  # Resolved once so the gate and the retag work from the same digests.
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      pending: ${{ steps.resolve.outputs.pending }}
      html_next: ${{ steps.resolve.outputs.html_next }}
    steps:
      - uses: actions/checkout@v7

      - id: images
        run: echo "images=$(yq -o=json -I0 '.' images.yml)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve what is pending
        id: resolve
        uses: actions/github-script@v9
        env:
          ALL_IMAGES: ${{ steps.images.outputs.images }}
          REQUESTED: ${{ inputs.images }}
          OWNER: ${{ github.repository_owner }}
        with:
          script: |
            const all = JSON.parse(process.env.ALL_IMAGES);
            const requested = (process.env.REQUESTED || '').split(/[\s,]+/).filter(Boolean);
            for (const image of requested) {
              if (!all.includes(image)) {
                core.setFailed(`Unknown image: ${image}`);
                return;
              }
            }
            const selected = requested.length > 0 ? requested : all;

            // {{.Manifest.Digest}} silently renders the whole output, not the digest.
            const digestOf = async (ref) => {
              const inspected = await exec.getExecOutput(
                'docker',
                ['buildx', 'imagetools', 'inspect', ref, '--format', '{{json .Manifest}}'],
                { ignoreReturnCode: true, silent: true }
              );
              return inspected.exitCode === 0 ? JSON.parse(inspected.stdout).digest : '';
            };

            const resolved = await Promise.all(selected.map(async (image) => {
              const repository = `ghcr.io/${process.env.OWNER}/dodona-${image}`;
              const next = await digestOf(`${repository}:next`);
              const current = next ? await digestOf(`${repository}:latest`) : '';
              return { image, next, current };
            }));

            const summary = (line) => core.summary.addRaw(`${line}\n`).write();

            await summary('## Pending');
            await summary('');
            await summary('| image | :latest |');
            await summary('| --- | --- |');

            const pending = [];
            for (const { image, next, current } of resolved) {
              // No :next tag at all is nothing pending, not a failure.
              if (!next) {
                console.log(`${image}: no :next tag`);
                await summary(`| \`${image}\` | nothing pending, no \`:next\` |`);
                continue;
              }

              if (next === current) {
                console.log(`${image}: :next is already :latest (${next})`);
                await summary(`| \`${image}\` | nothing pending, \`:next\` is already published |`);
                continue;
              }

              console.log(`${image}: ${current || 'none'} -> ${next}`);
              const from = current ? `\`${current}\`` : 'nothing';
              await summary(`| \`${image}\` | pending, moves to \`${next}\` from ${from} |`);
              pending.push({ image, next, current });
            }

            core.setOutput('pending', JSON.stringify(pending));
            core.setOutput('html_next', pending.find(p => p.image === 'html')?.next || '');

  # Runs the consumer judge on the digest about to be published, not a rebuild of it.
  # TODO: point the ref at @main once judge-html#289 is merged.
  e2e-judge-html:
    needs: detect
    if: ${{ !inputs.dry_run && needs.detect.outputs.html_next != '' }}
    permissions:
      contents: read
      packages: read
    uses: dodona-edu/judge-html/.github/workflows/e2e.yml@enhancement/image-owned-deps-spike
    with:
      image: ghcr.io/${{ github.repository_owner }}/dodona-html@${{ needs.detect.outputs.html_next }}

  publish:
    needs: [detect, e2e-judge-html]
    # The gate holds back html alone, the rest of the dispatch still publishes.
    # A dry run stops here, it only reports what is pending.
    if: ${{ !cancelled() && !inputs.dry_run && needs.detect.outputs.pending != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move next to latest
        uses: actions/github-script@v9
        env:
          PENDING: ${{ needs.detect.outputs.pending }}
          HTML_GATE: ${{ needs.e2e-judge-html.result }}
          OWNER: ${{ github.repository_owner }}
        with:
          script: |
            const pending = JSON.parse(process.env.PENDING);
            const htmlGate = process.env.HTML_GATE;

            const summary = (line) => core.summary.addRaw(`${line}\n`).write();

            await summary('## Published');
            await summary('');
            await summary('| image | :latest |');
            await summary('| --- | --- |');

            let published = 0;
            for (const { image, next, current } of pending) {
              const repository = `ghcr.io/${process.env.OWNER}/dodona-${image}`;

              if (image === 'html' && htmlGate !== 'success') {
                core.warning(`Not publishing html, the consumer E2E on ${next} did not pass (${htmlGate})`);
                await summary(`| \`html\` | held back, the consumer E2E on \`${next}\` did not pass |`);
                continue;
              }

              let from = 'nothing';
              if (current) {
                await exec.exec('docker', ['buildx', 'imagetools', 'create', '-t', `${repository}:previous`, `${repository}@${current}`]);
                from = `\`${current}\``;
              }
              await exec.exec('docker', ['buildx', 'imagetools', 'create', '-t', `${repository}:latest`, `${repository}@${next}`]);
              published += 1;
              await summary(`| \`${image}\` | moved to \`${next}\` from ${from} |`);
            }

            await summary('');
            await summary(`Published ${published} image(s).`);
