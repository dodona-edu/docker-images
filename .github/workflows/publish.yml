name: Publish

# Moves :next to :latest, the tag the workers pull. :previous keeps the digest
# :latest pointed at before this run, so rolling back is retagging it.

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  # Produces the pending report on demand, it never retags.
  workflow_dispatch:

concurrency:
  # Every run that retags waits its turn in ship, and queue: max is what keeps a
  # waiting one from being dropped by the next push or dispatch. It rules out
  # cancel-in-progress, so a superseded check queues behind its predecessor
  # instead of cancelling it.
  group: publish-${{ github.event_name == 'pull_request' && format('check-{0}', github.event.pull_request.number) || 'ship' }}
  queue: max

jobs:
  # On a pull request into master this is the manifest of what merging would
  # ship. On the merge itself it resolves the same digests for the retag.
  # Classification happens per image: a stale image, or one this pull request
  # changed without staging a build, turns the check red. An image with
  # simply nothing pending does not.
  manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      actions: read
      pull-requests: write
    outputs:
      pending: ${{ steps.resolve.outputs.pending }}
      html_next: ${{ steps.resolve.outputs.html_next }}
      python_next: ${{ steps.resolve.outputs.python_next }}
    steps:
      # A dev build in flight is about to replace :next, so the digests resolved
      # below would certify an image the merge will not ship. Every merge to dev
      # starts one and re-runs this check, so it waits rather than going red.
      # The poll covers the whole branch: a build of an older commit still
      # rewrites :next.
      - name: Wait for a dev build in flight
        if: ${{ github.event_name != 'push' }}
        uses: actions/github-script@v9
        with:
          script: |
            const pollSeconds = 20;
            const capMinutes = 20;
            const deadline = Date.now() + capMinutes * 60 * 1000;

            const runningBuilds = async () => {
              const runs = await Promise.all(['queued', 'in_progress'].map((status) =>
                github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'build.yml',
                  branch: 'dev',
                  status,
                  per_page: 1,
                })
              ));
              return runs.reduce((total, { data }) => total + data.total_count, 0);
            };

            while (true) {
              let running;
              try {
                running = await runningBuilds();
              } catch (error) {
                core.setFailed(`Could not tell whether a dev build is running (${error.message}), so a stale :next cannot be ruled out. Re-run this check when Build finishes.`);
                return;
              }

              if (running === 0) {
                break;
              }

              if (Date.now() >= deadline) {
                core.setFailed(`A dev build has been running for over ${capMinutes} minutes, so :next still does not hold dev's latest state. Re-run this check when Build finishes.`);
                return;
              }

              core.info(`Waiting on ${running} dev build(s), :next is not settled yet. Checking again in ${pollSeconds}s.`);
              await new Promise((resolve) => setTimeout(resolve, pollSeconds * 1000));
            }

      - uses: actions/checkout@v7
        with:
          # A pull request is otherwise checked out as the merge preview, and
          # what gets classified below is the state of dev's tip.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Staleness reads history back to the commit :next was built from.
          fetch-depth: 0

      # The classification diffs against master, which the checkout above was
      # not asked for.
      - name: Fetch master
        run: git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master

      - id: images
        run: echo "images=$(yq -o=json -I0 '.' images.yml)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Classify every image
        id: resolve
        uses: actions/github-script@v9
        env:
          ALL_IMAGES: ${{ steps.images.outputs.images }}
          OWNER: ${{ github.repository_owner }}
        with:
          script: |
            const all = JSON.parse(process.env.ALL_IMAGES);

            const run = (command, args) =>
              exec.getExecOutput(command, args, { ignoreReturnCode: true, silent: true });

            // {{.Manifest.Digest}} silently renders the whole output, not the digest.
            const digestOf = async (ref) => {
              const inspected = await run('docker', ['buildx', 'imagetools', 'inspect', ref, '--format', '{{json .Manifest}}']);
              if (inspected.exitCode !== 0) {
                return '';
              }
              try {
                return JSON.parse(inspected.stdout).digest || '';
              } catch {
                return '';
              }
            };

            // {{json .Image}} carries the config, and with it the labels the build stamped.
            const revisionOf = async (ref) => {
              const inspected = await run('docker', ['buildx', 'imagetools', 'inspect', ref, '--format', '{{json .Image}}']);
              if (inspected.exitCode !== 0) {
                return '';
              }
              try {
                return JSON.parse(inspected.stdout).config?.Labels?.['org.opencontainers.image.revision'] || '';
              } catch {
                return '';
              }
            };

            // build.yml derives these same paths for its own staleness check; keep the two in sync.
            const pathsOf = (image) => [`dodona-${image}.dockerfile`, `dodona-${image}`];

            // Anything that leaves the answer unknown counts as stale: publishing an
            // image older than dev is worse than asking for a rebuild.
            const stalenessOf = async (image, revision) => {
              if (!revision) {
                return 'the staged image carries no revision label';
              }

              const known = await run('git', ['cat-file', '-e', `${revision}^{commit}`]);
              if (known.exitCode !== 0) {
                return `the repository does not have commit ${revision}`;
              }

              const since = await run('git', ['rev-list', `${revision}..HEAD`, '--', ...pathsOf(image)]);
              if (since.exitCode !== 0) {
                return `the commits since ${revision} could not be listed (${since.stderr.trim()})`;
              }

              const commits = since.stdout.split('\n').filter(Boolean);
              if (commits.length > 0) {
                return `${commits.length} commit(s) landed since ${revision}`;
              }

              return '';
            };

            const claimedChanges = async (image) => {
              // The merge already happened, so what the pull request carried no longer
              // decides anything, and there is no pull request diff to read it from.
              if (context.eventName === 'push') {
                return null;
              }

              const diff = await run('git', ['diff', '--name-only', 'origin/master...HEAD', '--', ...pathsOf(image)]);
              // Unknown counts as changed, so an unbuildable image is not waved through,
              // but stays distinguishable from a genuine claim so the note can admit it.
              if (diff.exitCode !== 0) {
                return 'unknown';
              }

              return diff.stdout.split('\n').some((line) => line.trim() !== '');
            };

            const resolved = await Promise.all(all.map(async (image) => {
              const repository = `ghcr.io/${process.env.OWNER}/dodona-${image}`;
              const [next, current] = await Promise.all([digestOf(`${repository}:next`), digestOf(`${repository}:latest`)]);
              const staleness = next ? await stalenessOf(image, await revisionOf(`${repository}:next`)) : '';
              const claimed = await claimedChanges(image);
              return { image, repository, next, current, staleness, claimed };
            }));

            const rows = [];
            const pending = [];
            const blocking = [];

            for (const { image, repository, next, current, staleness, claimed } of resolved) {
              if (next && staleness) {
                console.log(`${image}: stale, ${staleness}`);
                rows.push({ image, status: 'stale', level: 'red', latest: current, ships: next, note: `${staleness}, a dev build has to land first` });
                blocking.push(image);
                continue;
              }

              if (next && next !== current) {
                console.log(`${image}: ${current || 'none'} -> ${next}`);
                // claimed is null on push, where there is no pull request diff to read; leave the note empty rather than guessing.
                const note = claimed === null ? '' : claimed === 'unknown' ? 'change detection failed, treated as changed' : claimed ? 'this pull request changes the image' : 'rebuild only, no source changes';
                rows.push({ image, status: 'pending', level: 'ok', latest: current, ships: next, note });
                pending.push({ image, repository, next, current });
                continue;
              }

              if (next) {
                console.log(`${image}: :next is already :latest (${next})`);
                rows.push({ image, status: 'up to date', level: 'ok', latest: current, ships: '', note: '' });
                continue;
              }

              if (claimed) {
                console.log(`${image}: changed here, nothing staged`);
                // claimed === 'unknown' is still truthy, so this keeps blocking, but the note admits the uncertainty.
                const note = claimed === 'unknown'
                  ? 'change detection failed, treated as changed; nothing is staged for this image'
                  : 'this pull request changes the image but nothing was staged for it';
                rows.push({ image, status: 'not staged', level: 'red', latest: current, ships: '', note });
                blocking.push(image);
                continue;
              }

              console.log(`${image}: no :next tag`);
              rows.push({ image, status: 'not staged', level: 'warn', latest: current, ships: '', note: 'nothing to ship, :latest stays where it is' });
            }

            const icon = { red: '❌', warn: '⚠️', ok: '✅' };

            // Shared by the step summary and the PR comment, so the two never drift apart.
            // A nested list instead of a table: the full sha256 digests need to stay
            // copy-pasteable for rollbacks, and two full-digest table columns force
            // horizontal scrolling and kill scannability.
            const renderManifest = () => {
              const lines = [];
              lines.push('## Manifest');
              lines.push('');

              for (const { image, status, level, latest, ships, note } of rows) {
                const summary = note ? `${status}, ${note}` : status;
                lines.push(`- ${icon[level]} \`${image}\` ${summary}`);

                if (ships) {
                  const shipsLine = latest ? `ships \`${ships}\` replacing \`${latest}\`` : `ships \`${ships}\``;
                  lines.push(`  - ${shipsLine}`);
                }
              }

              lines.push('');
              lines.push(`${pending.length} image(s) would ship.`);
              return lines.join('\n');
            };

            const manifest = renderManifest();
            await core.summary.addRaw(`${manifest}\n`).write();

            // Only a pull request has a PR to comment on; push (the merge itself) and
            // workflow_dispatch (an on-demand report) have nowhere to post this.
            if (context.eventName === 'pull_request') {
              // Marks the comment this job owns, so re-runs update it instead of piling up.
              const marker = '<!-- ship-manifest -->';
              const owner = context.repo.owner;
              const repo = context.repo.repo;
              const issue_number = context.payload.pull_request.number;

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100,
              });
              const existing = comments.find((comment) => comment.body?.startsWith(marker));

              const body = `${marker}\n${manifest}`;
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            }

            core.setOutput('pending', JSON.stringify(pending));
            core.setOutput('html_next', pending.find(p => p.image === 'html')?.next || '');
            core.setOutput('python_next', pending.find(p => p.image === 'python')?.next || '');

            if (blocking.length > 0 && context.eventName === 'pull_request') {
              core.setFailed(`${blocking.join(', ')} would not publish safely, see the manifest above for why.`);
            }

  # Runs the consumer judge on the digest merging would publish, not on a rebuild
  # of it. The retag needs no link to this: a red check blocks the merge.
  e2e-judge-html:
    needs: manifest
    if: ${{ github.event_name == 'pull_request' && needs.manifest.outputs.html_next != '' }}
    permissions:
      contents: read
      packages: read
    uses: dodona-edu/judge-html/.github/workflows/e2e.yml@main
    with:
      image: ghcr.io/${{ github.repository_owner }}/dodona-html@${{ needs.manifest.outputs.html_next }}

  # judge-pythia is private, and a public repository cannot call a private one's
  # reusable workflow, so this job checks the judge out with a read-only checkout
  # key and runs its suite here.
  e2e-judge-pythia:
    needs: manifest
    if: ${{ github.event_name == 'pull_request' && needs.manifest.outputs.python_next != '' }}
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/dodona-python@${{ needs.manifest.outputs.python_next }}
      options: --user root
    steps:
      - uses: actions/checkout@v7
        with:
          repository: dodona-edu/judge-pythia
          ref: master
          ssh-key: ${{ secrets.JUDGE_PYTHIA_CHECKOUT_KEY }}
      - name: Save the new output
        run: .github/workflows/integration-tests . integration-tests integration-tests/generated
      - name: Compare original and new output
        run: diff -r integration-tests/expected integration-tests/generated

  e2e-judge-turtle:
    needs: manifest
    if: ${{ github.event_name == 'pull_request' && needs.manifest.outputs.python_next != '' }}
    permissions:
      contents: read
      packages: read
    uses: dodona-edu/judge-turtle/.github/workflows/e2e.yml@main
    with:
      image: ghcr.io/${{ github.repository_owner }}/dodona-python@${{ needs.manifest.outputs.python_next }}

  # Required-check anchor: the gate jobs report different check names when they
  # run versus when they skip, so rulesets require this job instead.
  publishable:
    needs: [manifest, e2e-judge-html, e2e-judge-pythia, e2e-judge-turtle]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a needed job failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

  publish:
    needs: manifest
    # The pull request check is the approval, so merging is what publishes.
    if: ${{ github.event_name == 'push' && needs.manifest.outputs.pending != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move next to latest
        uses: actions/github-script@v9
        env:
          PENDING: ${{ needs.manifest.outputs.pending }}
        with:
          script: |
            const pending = JSON.parse(process.env.PENDING);

            const summary = (line) => core.summary.addRaw(`${line}\n`).write();

            await summary('## Published');
            await summary('');
            await summary('| image | :latest |');
            await summary('| --- | --- |');

            for (const { image, repository, next, current } of pending) {
              const from = current ? `\`${current}\`` : 'nothing';

              if (current) {
                await exec.exec('docker', ['buildx', 'imagetools', 'create', '-t', `${repository}:previous`, `${repository}@${current}`]);
              }
              await exec.exec('docker', ['buildx', 'imagetools', 'create', '-t', `${repository}:latest`, `${repository}@${next}`]);

              await summary(`| \`${image}\` | moved to \`${next}\` from ${from} |`);
            }

            await summary('');
            await summary(`Published ${pending.length} image(s).`);
