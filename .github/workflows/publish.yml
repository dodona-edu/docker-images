name: Publish

# Moves :next to :latest, the tag the next worker image bakes in. :previous keeps
# the digest :latest pointed at before this run, so rolling back is retagging it.

on:
  workflow_call:
    inputs:
      ship:
        type: boolean
        required: true
    secrets:
      PGJUDGE_DEPLOY_TOKEN:
        required: true
      JUDGE_PYTHIA_CHECKOUT_KEY:
        required: true
      JUDGE_BASH_CHECKOUT_KEY:
        required: true
  # Produces the pending report on demand, it never retags.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Resolves the digests :next holds for the retag. A stale image fails the
  # manifest; an image with nothing pending does not.
  manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      pending: ${{ steps.resolve.outputs.pending }}
      html_next: ${{ steps.resolve.outputs.html_next }}
      python_next: ${{ steps.resolve.outputs.python_next }}
      sqlite_next: ${{ steps.resolve.outputs.sqlite_next }}
      assembly_next: ${{ steps.resolve.outputs.assembly_next }}
      prolog_next: ${{ steps.resolve.outputs.prolog_next }}
      haskell_next: ${{ steps.resolve.outputs.haskell_next }}
      scheme_next: ${{ steps.resolve.outputs.scheme_next }}
      postgres_next: ${{ steps.resolve.outputs.postgres_next }}
      c_next: ${{ steps.resolve.outputs.c_next }}
      r_next: ${{ steps.resolve.outputs.r_next }}
      compilers_next: ${{ steps.resolve.outputs.compilers_next }}
      markdown_next: ${{ steps.resolve.outputs.markdown_next }}
      java_next: ${{ steps.resolve.outputs.java_next }}
      csharp_next: ${{ steps.resolve.outputs.csharp_next }}
      tested_next: ${{ steps.resolve.outputs.tested_next }}
      bash_next: ${{ steps.resolve.outputs.bash_next }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Staleness reads history back to the commit :next was built from.
          fetch-depth: 0

      - id: images
        run: echo "images=$(yq -o=json -I0 '.' images.yml)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Classify every image
        id: resolve
        uses: actions/github-script@v9
        env:
          ALL_IMAGES: ${{ steps.images.outputs.images }}
          OWNER: ${{ github.repository_owner }}
        with:
          script: |
            const all = JSON.parse(process.env.ALL_IMAGES);

            const run = (command, args) =>
              exec.getExecOutput(command, args, { ignoreReturnCode: true, silent: true });

            // {{.Manifest.Digest}} silently renders the whole output, not the digest.
            const digestOf = async (ref) => {
              const inspected = await run('docker', ['buildx', 'imagetools', 'inspect', ref, '--format', '{{json .Manifest}}']);
              if (inspected.exitCode !== 0) {
                console.log(`${ref}: imagetools inspect failed (exit ${inspected.exitCode}): ${inspected.stderr.trim()}`);
                return '';
              }
              try {
                return JSON.parse(inspected.stdout).digest || '';
              } catch {
                return '';
              }
            };

            // {{json .Image}} carries the config, and with it the labels the build stamped.
            const revisionOf = async (ref) => {
              const inspected = await run('docker', ['buildx', 'imagetools', 'inspect', ref, '--format', '{{json .Image}}']);
              if (inspected.exitCode !== 0) {
                console.log(`${ref}: imagetools inspect failed (exit ${inspected.exitCode}): ${inspected.stderr.trim()}`);
                return '';
              }
              try {
                return JSON.parse(inspected.stdout).config?.Labels?.['org.opencontainers.image.revision'] || '';
              } catch {
                return '';
              }
            };

            // build.yml derives these same paths for its own staleness check; keep the two in sync.
            const pathsOf = (image) => [`dodona-${image}.dockerfile`, `dodona-${image}`];

            // Anything that leaves the answer unknown counts as stale: publishing an
            // image older than master is worse than asking for a rebuild.
            const stalenessOf = async (image, revision) => {
              if (!revision) {
                return 'the staged image carries no revision label';
              }

              const known = await run('git', ['cat-file', '-e', `${revision}^{commit}`]);
              if (known.exitCode !== 0) {
                return `the repository does not have commit ${revision}`;
              }

              const changed = await run('git', ['diff', '--quiet', revision, 'HEAD', '--', ...pathsOf(image)]);
              if (changed.exitCode === 1) {
                return `the image's files changed since ${revision}`;
              }
              if (changed.exitCode !== 0) {
                return `the files since ${revision} could not be compared (${changed.stderr.trim()})`;
              }

              return '';
            };

            const resolved = await Promise.all(all.map(async (image) => {
              const repository = `ghcr.io/${process.env.OWNER}/dodona-${image}`;
              const [next, current] = await Promise.all([digestOf(`${repository}:next`), digestOf(`${repository}:latest`)]);
              // Also needed for the "built from" line below, so keep it rather than
              // discarding it once the staleness check has read it.
              const nextRevision = next ? await revisionOf(`${repository}:next`) : '';
              const staleness = next ? await stalenessOf(image, nextRevision) : '';
              return { image, repository, next, current, nextRevision, staleness };
            }));

            const rows = [];
            const pending = [];
            const blocking = [];

            for (const { image, repository, next, current, nextRevision, staleness } of resolved) {
              if (next && staleness) {
                console.log(`${image}: stale, ${staleness}`);
                // Only fetched for rows that actually render a "replacing" sub-bullet,
                // to spare a registry call for the up to date / not staged rows below.
                const currentRevision = current ? await revisionOf(`${repository}:latest`) : '';
                rows.push({ image, status: 'stale', level: 'red', latest: current, ships: next, note: `${staleness}, a build on master has to land first`, nextRevision, currentRevision });
                blocking.push(image);
                continue;
              }

              if (next && next !== current) {
                console.log(`${image}: ${current || 'none'} -> ${next}`);
                const currentRevision = current ? await revisionOf(`${repository}:latest`) : '';
                rows.push({ image, status: 'pending', level: 'ok', latest: current, ships: next, note: '', nextRevision, currentRevision });
                pending.push({ image, repository, next, current });
                continue;
              }

              if (next) {
                console.log(`${image}: :next is already :latest (${next})`);
                rows.push({ image, status: 'up to date', level: 'ok', latest: current, ships: '', note: '' });
                continue;
              }

              console.log(`${image}: no :next tag`);
              rows.push({ image, status: 'not staged', level: 'warn', latest: current, ships: '', note: 'nothing to ship, :latest stays where it is' });
            }

            const icon = { red: '❌', warn: '⚠️', ok: '✅' };

            // Digests answer identity but not "what code is this", so link the
            // revision label back to the commit it was built from.
            const commitUrl = (revision) => `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${revision}`;
            const builtFrom = (revision) => revision ? ` built from [\`${revision.slice(0, 7)}\`](${commitUrl(revision)})` : '';

            // A nested list instead of a table: the full sha256 digests need to stay
            // copy-pasteable for rollbacks, and two full-digest table columns force
            // horizontal scrolling and kill scannability.
            const renderManifest = () => {
              const lines = [];
              lines.push('## Manifest');
              lines.push('');
              lines.push(`${pending.length} image(s) would ship.`);

              const renderRows = (rowsToRender) => {
                for (const { image, status, level, latest, ships, note, nextRevision, currentRevision } of rowsToRender) {
                  const summary = note ? `${status}, ${note}` : status;
                  lines.push(`- ${icon[level]} \`${image}\` ${summary}`);

                  if (ships) {
                    lines.push(`  - ships \`${ships}\`${builtFrom(nextRevision)}`);
                    if (latest) {
                      lines.push(`  - replacing \`${latest}\`${builtFrom(currentRevision)}`);
                    }
                  }
                }
              };

              // What ships goes first: pending, then red (stale), then warn. Alphabetical
              // within each group falls out of images.yml's own order, which rows never
              // reshuffles. Up to date carries no urgency, so it moves below the fold.
              const upToDate = rows.filter((row) => row.status === 'up to date');
              const shipping = rows.filter((row) => row.status !== 'up to date');
              const ordered = [
                ...shipping.filter((row) => row.level === 'ok'),
                ...shipping.filter((row) => row.level === 'red'),
                ...shipping.filter((row) => row.level === 'warn'),
              ];

              if (ordered.length > 0) {
                lines.push('');
                renderRows(ordered);
              }

              if (upToDate.length > 0) {
                lines.push('');
                lines.push('<details>');
                lines.push(`<summary>${upToDate.length} up to date</summary>`);
                lines.push('');
                renderRows(upToDate);
                lines.push('');
                lines.push('</details>');
              }

              return lines.join('\n');
            };

            const manifest = renderManifest();
            await core.summary.addRaw(`${manifest}\n`).write();

            core.setOutput('pending', JSON.stringify(pending));
            core.setOutput('html_next', pending.find(p => p.image === 'html')?.next || '');
            core.setOutput('python_next', pending.find(p => p.image === 'python')?.next || '');
            core.setOutput('sqlite_next', pending.find(p => p.image === 'sqlite')?.next || '');
            core.setOutput('assembly_next', pending.find(p => p.image === 'assembly')?.next || '');
            core.setOutput('prolog_next', pending.find(p => p.image === 'prolog')?.next || '');
            core.setOutput('haskell_next', pending.find(p => p.image === 'haskell')?.next || '');
            core.setOutput('scheme_next', pending.find(p => p.image === 'scheme')?.next || '');
            core.setOutput('postgres_next', pending.find(p => p.image === 'postgres')?.next || '');
            core.setOutput('c_next', pending.find(p => p.image === 'c')?.next || '');
            core.setOutput('r_next', pending.find(p => p.image === 'r')?.next || '');
            core.setOutput('compilers_next', pending.find(p => p.image === 'compilers')?.next || '');
            core.setOutput('markdown_next', pending.find(p => p.image === 'markdown')?.next || '');
            core.setOutput('java_next', pending.find(p => p.image === 'java')?.next || '');
            core.setOutput('csharp_next', pending.find(p => p.image === 'csharp')?.next || '');
            core.setOutput('tested_next', pending.find(p => p.image === 'tested')?.next || '');
            core.setOutput('bash_next', pending.find(p => p.image === 'bash')?.next || '');

            if (blocking.length > 0) {
              core.setFailed(`${blocking.join(', ')} would not publish safely, see the manifest above for why.`);
            }

  # The gates run the consumer judge on the exact digest the retag moves.
  e2e-judge-html:
    needs: manifest
    if: ${{ inputs.ship && needs.manifest.outputs.html_next != '' }}
    permissions:
      contents: read
      packages: read
    uses: dodona-edu/judge-html/.github/workflows/e2e.yml@main
    with:
      image: ghcr.io/${{ github.repository_owner }}/dodona-html@${{ needs.manifest.outputs.html_next }}

  e2e-judge-sql:
    needs: manifest
    if: ${{ inputs.ship && needs.manifest.outputs.sqlite_next != '' }}
    permissions:
      contents: read
      packages: read
    uses: dodona-edu/judge-sql/.github/workflows/e2e.yml@main
    with:
      image: ghcr.io/${{ github.repository_owner }}/dodona-sqlite@${{ needs.manifest.outputs.sqlite_next }}

  e2e-judge-assembly:
    needs: manifest
    if: ${{ inputs.ship && needs.manifest.outputs.assembly_next != '' }}
    permissions:
      contents: read
      packages: read
    uses: dodona-edu/judge-assembly/.github/workflows/e2e.yml@main
    with:
      image: ghcr.io/${{ github.repository_owner }}/dodona-assembly@${{ needs.manifest.outputs.assembly_next }}

  e2e-judge-prolog:
    needs: manifest
    if: ${{ inputs.ship && needs.manifest.outputs.prolog_next != '' }}
    permissions:
      contents: read
      packages: read
    uses: dodona-edu/judge-prolog/.github/workflows/e2e.yml@master
    with:
      image: ghcr.io/${{ github.repository_owner }}/dodona-prolog@${{ needs.manifest.outputs.prolog_next }}

  e2e-judge-haskell:
    needs: manifest
    if: ${{ inputs.ship && needs.manifest.outputs.haskell_next != '' }}
    permissions:
      contents: read
      packages: read
    uses: dodona-edu/judge-haskell/.github/workflows/e2e.yml@master
    with:
      image: ghcr.io/${{ github.repository_owner }}/dodona-haskell@${{ needs.manifest.outputs.haskell_next }}

  e2e-judge-scheme:
    needs: manifest
    if: ${{ inputs.ship && needs.manifest.outputs.scheme_next != '' }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/e2e-judge-scheme.yml
    with:
      image: ghcr.io/${{ github.repository_owner }}/dodona-scheme@${{ needs.manifest.outputs.scheme_next }}

  e2e-judge-postgres:
    needs: manifest
    if: ${{ inputs.ship && needs.manifest.outputs.postgres_next != '' }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/e2e-judge-postgres.yml
    with:
      image: ghcr.io/${{ github.repository_owner }}/dodona-postgres@${{ needs.manifest.outputs.postgres_next }}
    secrets:
      PGJUDGE_DEPLOY_TOKEN: ${{ secrets.PGJUDGE_DEPLOY_TOKEN }}

  e2e-judge-c:
    needs: manifest
    if: ${{ inputs.ship && needs.manifest.outputs.c_next != '' }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/e2e-judge-c.yml
    with:
      image: ghcr.io/${{ github.repository_owner }}/dodona-c@${{ needs.manifest.outputs.c_next }}

  e2e-judge-r:
    needs: manifest
    if: ${{ inputs.ship && needs.manifest.outputs.r_next != '' }}
    permissions:
      contents: read
      packages: read
    uses: dodona-edu/judge-r/.github/workflows/e2e.yml@master
    with:
      image: ghcr.io/${{ github.repository_owner }}/dodona-r@${{ needs.manifest.outputs.r_next }}

  e2e-judge-compilers:
    needs: manifest
    if: ${{ inputs.ship && needs.manifest.outputs.compilers_next != '' }}
    permissions:
      contents: read
      packages: read
    uses: dodona-edu/judge-compilers/.github/workflows/e2e.yml@main
    with:
      image: ghcr.io/${{ github.repository_owner }}/dodona-compilers@${{ needs.manifest.outputs.compilers_next }}

  e2e-judge-markdown:
    needs: manifest
    if: ${{ inputs.ship && needs.manifest.outputs.markdown_next != '' }}
    permissions:
      contents: read
      packages: read
    uses: dodona-edu/judge-markdown/.github/workflows/e2e.yml@master
    with:
      image: ghcr.io/${{ github.repository_owner }}/dodona-markdown@${{ needs.manifest.outputs.markdown_next }}

  e2e-judge-java:
    needs: manifest
    if: ${{ inputs.ship && needs.manifest.outputs.java_next != '' }}
    permissions:
      contents: read
      packages: read
    uses: dodona-edu/judge-java/.github/workflows/e2e.yml@master
    with:
      image: ghcr.io/${{ github.repository_owner }}/dodona-java@${{ needs.manifest.outputs.java_next }}

  e2e-judge-csharp:
    needs: manifest
    if: ${{ inputs.ship && needs.manifest.outputs.csharp_next != '' }}
    permissions:
      contents: read
      packages: read
    uses: dodona-edu/judge-csharp/.github/workflows/e2e.yml@master
    with:
      image: ghcr.io/${{ github.repository_owner }}/dodona-csharp@${{ needs.manifest.outputs.csharp_next }}

  # judge-pythia is private, so this job checks it out with a read-only checkout key. The image
  # ships no git or ssh client, so the checkout runs on the runner and the tests in the image.
  e2e-judge-pythia:
    needs: manifest
    if: ${{ inputs.ship && needs.manifest.outputs.python_next != '' }}
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: dodona-edu/judge-pythia
          ref: master
          ssh-key: ${{ secrets.JUDGE_PYTHIA_CHECKOUT_KEY }}
          persist-credentials: false
      - name: Run judge-pythia's tests in the image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/dodona-python@${{ needs.manifest.outputs.python_next }}
        # SKIP_RUFF_VERSION_TEST: judge-pythia's requirements-match-image guards the ruff pin; the test would fail every ruff bump here
        run: docker run --rm --user root -e SKIP_RUFF_VERSION_TEST=1 -v "$PWD:/judge" -w /judge "$IMAGE" devel/run-tests-in-image.sh

  # judge-bash is private, so this job checks it out with a read-only checkout key. The image
  # ships no ssh client, so the checkout runs on the runner and the suite in the image.
  e2e-judge-bash:
    needs: manifest
    if: ${{ inputs.ship && needs.manifest.outputs.bash_next != '' }}
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: dodona-edu/judge-bash
          ref: master
          ssh-key: ${{ secrets.JUDGE_BASH_CHECKOUT_KEY }}
          persist-credentials: false
      - name: Run the judge-bash suite
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/dodona-bash@${{ needs.manifest.outputs.bash_next }}
        run: ./devel/run-tests-in-image.sh

  e2e-judge-turtle:
    needs: manifest
    if: ${{ inputs.ship && needs.manifest.outputs.python_next != '' }}
    permissions:
      contents: read
      packages: read
    uses: dodona-edu/judge-turtle/.github/workflows/e2e.yml@main
    with:
      image: ghcr.io/${{ github.repository_owner }}/dodona-python@${{ needs.manifest.outputs.python_next }}

  e2e-universal-judge:
    needs: manifest
    if: ${{ inputs.ship && needs.manifest.outputs.tested_next != '' }}
    permissions:
      contents: read
      packages: read
    uses: dodona-edu/universal-judge/.github/workflows/e2e.yml@master
    with:
      image: ghcr.io/${{ github.repository_owner }}/dodona-tested@${{ needs.manifest.outputs.tested_next }}

  # Collapses the gates into one result for publish: every gate that ran must pass.
  publishable:
    needs: [manifest, e2e-judge-html, e2e-judge-sql, e2e-judge-assembly, e2e-judge-prolog, e2e-judge-haskell, e2e-judge-scheme, e2e-judge-postgres, e2e-judge-c, e2e-judge-r, e2e-judge-compilers, e2e-judge-markdown, e2e-judge-java, e2e-judge-csharp, e2e-judge-pythia, e2e-judge-bash, e2e-judge-turtle, e2e-universal-judge]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a needed job failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

  publish:
    needs: [manifest, publishable]
    # A failed gate leaves every :latest where it was.
    if: ${{ !cancelled() && inputs.ship && needs.publishable.result == 'success' && needs.manifest.outputs.pending != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move next to latest
        uses: actions/github-script@v9
        env:
          PENDING: ${{ needs.manifest.outputs.pending }}
        with:
          script: |
            const pending = JSON.parse(process.env.PENDING);

            const summary = (line) => core.summary.addRaw(`${line}\n`).write();

            await summary('## Published');
            await summary('');
            await summary('| image | :latest |');
            await summary('| --- | --- |');

            for (const { image, repository, next, current } of pending) {
              const from = current ? `\`${current}\`` : 'nothing';

              if (current) {
                await exec.exec('docker', ['buildx', 'imagetools', 'create', '-t', `${repository}:previous`, `${repository}@${current}`]);
              }
              await exec.exec('docker', ['buildx', 'imagetools', 'create', '-t', `${repository}:latest`, `${repository}@${next}`]);

              await summary(`| \`${image}\` | moved to \`${next}\` from ${from} |`);
            }

            await summary('');
            await summary(`Published ${pending.length} image(s).`);
