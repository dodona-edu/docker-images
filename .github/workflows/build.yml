name: Build

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:
    inputs:
      force_all:
        description: Force rebuild all images
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Runs that write the same tag take one lane: :next on master, :pr-N per pull
  # request. A newer run replaces the one still waiting; a running one finishes.
  group: build-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}

jobs:
  detect:
    permissions:
      contents: read
      packages: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.set-matrix.outputs.images }}
      has_images: ${{ steps.set-matrix.outputs.has_images }}
      refs: ${{ steps.set-matrix.outputs.refs }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Staleness reads history back to the commit :next was built from.
          fetch-depth: 0
          persist-credentials: false

      - id: images
        run: echo "images=$(yq -o=json -I0 '.' images.yml)" >> "$GITHUB_OUTPUT"

      - name: Build filters
        if: ${{ github.event_name != 'push' }}
        id: genfilters
        uses: actions/github-script@v9
        env:
          IMAGES: ${{ steps.images.outputs.images }}
        with:
          script: |
            const imgs = JSON.parse(process.env.IMAGES);
            const map = Object.fromEntries(imgs.map(i => [i, [`dodona-${i}.dockerfile`, `dodona-${i}/**`, 'main.sh']]));
            core.setOutput('filters', JSON.stringify(map));

      - name: Detect changed images
        if: ${{ github.event_name != 'push' }}
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: ${{ steps.genfilters.outputs.filters }}

      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # What a push touched says nothing about what :next holds, so master asks the
      # tag instead: every image whose :next is not this commit's state is built.
      - name: Detect stale images
        if: ${{ github.event_name == 'push' }}
        id: stale
        uses: actions/github-script@v9
        env:
          ALL_IMAGES: ${{ steps.images.outputs.images }}
          OWNER: ${{ github.repository_owner }}
        with:
          script: |
            const all = JSON.parse(process.env.ALL_IMAGES);

            const run = (command, args) =>
              exec.getExecOutput(command, args, { ignoreReturnCode: true, silent: true });

            // {{json .Image}} carries the config, and with it the labels the build stamped.
            const revisionOf = async (ref) => {
              const inspected = await run('docker', ['buildx', 'imagetools', 'inspect', ref, '--format', '{{json .Image}}']);
              if (inspected.exitCode !== 0) {
                console.log(`${ref}: imagetools inspect failed (exit ${inspected.exitCode}): ${inspected.stderr.trim()}`);
                return '';
              }
              try {
                return JSON.parse(inspected.stdout).config?.Labels?.['org.opencontainers.image.revision'] || '';
              } catch {
                return '';
              }
            };

            const revisions = await Promise.all(all.map(async (image) => ({
              image,
              revision: await revisionOf(`ghcr.io/${process.env.OWNER}/dodona-${image}:next`),
            })));

            // Every branch below that cannot show :next is current builds instead.
            // A needless build costs one run, a wrong skip leaves :next behind master
            // until someone touches the image again. It is also what heals a failed
            // build: :next keeps the revision of the last one that landed, so the
            // next push rebuilds what that one did not.
            const stale = [];
            for (const { image, revision } of revisions) {
              if (!revision) {
                console.log(`${image}: no :next tag, or no revision on it`);
                stale.push(image);
                continue;
              }

              const known = await run('git', ['cat-file', '-e', `${revision}^{commit}`]);
              if (known.exitCode !== 0) {
                console.log(`${image}: :next was built from ${revision}, which this repository does not have`);
                stale.push(image);
                continue;
              }

              const changed = await run('git', ['diff', '--quiet', revision, 'HEAD', '--', `dodona-${image}.dockerfile`, `dodona-${image}`, 'main.sh']);
              if (changed.exitCode === 1) {
                console.log(`${image}: the image's files changed since ${revision}`);
                stale.push(image);
                continue;
              }
              if (changed.exitCode !== 0) {
                console.log(`${image}: could not compare files since ${revision} (${changed.stderr.trim()})`);
                stale.push(image);
                continue;
              }

              console.log(`${image}: :next is current at ${revision}`);
            }

            core.setOutput('images', JSON.stringify(stale));
            console.log('Stale images:', stale);

      - name: Set matrix
        uses: actions/github-script@v9
        id: set-matrix
        env:
          ALL_IMAGES: ${{ steps.images.outputs.images }}
          CHANGED: ${{ steps.filter.outputs.changes }}
          STALE: ${{ steps.stale.outputs.images }}
          FORCE_ALL: ${{ github.event.inputs.force_all || 'false' }}
          OWNER: ${{ github.repository_owner }}
        with:
          script: |
            const all = JSON.parse(process.env.ALL_IMAGES);
            const detected = context.eventName === 'push'
              ? JSON.parse(process.env.STALE || '[]')
              : JSON.parse(process.env.CHANGED || '[]');
            const forceAll = process.env.FORCE_ALL === 'true';
            const selected = forceAll ? all : all.filter(i => detected.includes(i));
            core.setOutput('images', JSON.stringify(selected));
            core.setOutput('has_images', selected.length > 0 ? 'true' : 'false');
            const refs = context.eventName === 'pull_request'
              ? Object.fromEntries(selected.map(i => [i, `ghcr.io/${process.env.OWNER}/dodona-${i}:pr-${context.payload.pull_request.number}`]))
              : {};
            core.setOutput('refs', JSON.stringify(refs));
            console.log('Selected images:', selected);

  build:
    needs: detect
    if: ${{ needs.detect.outputs.has_images == 'true' }}
    # Dependabot-triggered runs get an all-read token unless the workflow
    # states permissions itself, so a bump's candidate push here would fail.
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    name: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.detect.outputs.images) }}

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # A build on master stages to :next, the publish job moves it to :latest.
    - name: Set docker tags
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: |
          ghcr.io/${{ github.repository_owner }}/dodona-${{ matrix.image }}
        tags: |
          type=ref,event=pr
          type=raw,value=next,enable=${{ github.ref_name == 'master' }}

    - name: Build and push (GHCR)
      uses: docker/build-push-action@v7
      with:
        context: .
        file: dodona-${{ matrix.image }}.dockerfile
        push: true
        platforms: 'linux/amd64'
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # One cache per image, shared by pull requests and master: a merge reuses the layers its pull request built.
        cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/dodona-${{ matrix.image }}:buildcache
        cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/dodona-${{ matrix.image }}:buildcache,mode=max
        # The registry cache never expires: a forced rebuild skips it, or it would refresh nothing.
        no-cache: ${{ github.event.inputs.force_all == 'true' }}

  manifest:
    needs: [detect, build]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref_name == 'master' && needs.detect.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/manifest.yml

  # Pull requests verify their :pr-N images, master the :next digests publish moves.
  e2e:
    needs: [detect, build, manifest]
    if: ${{ !cancelled() && ((github.event_name == 'pull_request' && needs.build.result == 'success') || needs.manifest.result == 'success') }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/e2e.yml
    with:
      refs: ${{ github.event_name == 'pull_request' && needs.detect.outputs.refs || needs.manifest.outputs.refs }}
    secrets:
      PGJUDGE_DEPLOY_TOKEN: ${{ secrets.PGJUDGE_DEPLOY_TOKEN }}
      JUDGE_PYTHIA_CHECKOUT_KEY: ${{ secrets.JUDGE_PYTHIA_CHECKOUT_KEY }}
      JUDGE_BASH_CHECKOUT_KEY: ${{ secrets.JUDGE_BASH_CHECKOUT_KEY }}

  # Rulesets require this job, not the gate jobs, whose check names differ between run and skip.
  # Publish waits on it too: every gate that ran must pass.
  gates:
    needs: [detect, build, manifest, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a needed job failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

  # Same run and concurrency lane as the build, so :next cannot move before the retag.
  # :previous keeps the digest :latest pointed at before this run, so rolling back is retagging it.
  publish:
    needs: [manifest, e2e, gates]
    # A failed or skipped gate leaves every :latest where it was.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref_name == 'master' && needs.manifest.result == 'success' && needs.e2e.result == 'success' && needs.gates.result == 'success' && needs.manifest.outputs.pending != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move next to latest
        uses: actions/github-script@v9
        env:
          PENDING: ${{ needs.manifest.outputs.pending }}
        with:
          script: |
            const pending = JSON.parse(process.env.PENDING);

            const summary = (line) => core.summary.addRaw(`${line}\n`).write();

            await summary('## Published');
            await summary('');
            await summary('| image | :latest |');
            await summary('| --- | --- |');

            for (const { image, repository, next, current } of pending) {
              const from = current ? `\`${current}\`` : 'nothing';

              if (current) {
                await exec.exec('docker', ['buildx', 'imagetools', 'create', '-t', `${repository}:previous`, `${repository}@${current}`]);
              }
              await exec.exec('docker', ['buildx', 'imagetools', 'create', '-t', `${repository}:latest`, `${repository}@${next}`]);

              await summary(`| \`${image}\` | moved to \`${next}\` from ${from} |`);
            }

            await summary('');
            await summary(`Published ${pending.length} image(s).`);
