name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      force_all:
        description: Force rebuild all images
        type: boolean
        default: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.set-matrix.outputs.images }}
      has_images: ${{ steps.set-matrix.outputs.has_images }}
    steps:
      - uses: actions/checkout@v7

      - id: images
        run: echo "images=$(yq -o=json -I0 '.' images.yml)" >> "$GITHUB_OUTPUT"

      - name: Build filters
        id: genfilters
        uses: actions/github-script@v9
        env:
          IMAGES: ${{ steps.images.outputs.images }}
        with:
          script: |
            const imgs = JSON.parse(process.env.IMAGES);
            const map = Object.fromEntries(imgs.map(i => [i, [`dodona-${i}.dockerfile`, `dodona-${i}/**`]]));
            core.setOutput('filters', JSON.stringify(map));

      - name: Detect changed images
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: ${{ steps.genfilters.outputs.filters }}

      - name: Set flags
        uses: actions/github-script@v9
        id: flags
        with:
          script: |
            const labels = (context.payload.pull_request?.labels || []).map(l => l.name);
            core.setOutput('rebuild_all', labels.includes('rebuild-all') ? 'true' : 'false');

      - name: Set matrix
        uses: actions/github-script@v9
        id: set-matrix
        env:
          ALL_IMAGES: ${{ steps.images.outputs.images }}
          CHANGED: ${{ steps.filter.outputs.changes }}
          FORCE_ALL: ${{ github.event.inputs.force_all || 'false' }}
          REBUILD_ALL: ${{ steps.flags.outputs.rebuild_all }}
        with:
          script: |
            const all = JSON.parse(process.env.ALL_IMAGES);
            const changed = JSON.parse(process.env.CHANGED || '[]');
            const forceAll = process.env.FORCE_ALL === 'true' || process.env.REBUILD_ALL === 'true';
            // promote.yml stages :next for these from the digest the pull request
            // already tested, so a master rebuild would replace it with an untested one.
            // Must list the same images as promote.yml's filter.
            const promotedOnMerge = ['html'];
            // force_all and the rebuild-all label stay an escape hatch and do rebuild them.
            const selected = forceAll
              ? all
              : all.filter(i => changed.includes(i))
                   .filter(i => context.eventName !== 'push' || !promotedOnMerge.includes(i));
            core.setOutput('images', JSON.stringify(selected));
            core.setOutput('has_images', selected.length > 0 ? 'true' : 'false');
            console.log('Selected images:', selected);

  build:
    needs: detect
    if: ${{ needs.detect.outputs.has_images == 'true' }}
    runs-on: ubuntu-latest
    name: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.detect.outputs.images) }}

    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # A build on master stages to :next, publish.yml moves it to :latest.
    - name: Set docker tags
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: |
          ghcr.io/${{ github.repository_owner }}/dodona-${{ matrix.image }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=raw,value=next,enable={{is_default_branch}}

    - name: Build and push (GHCR)
      uses: docker/build-push-action@v7
      with:
        context: .
        file: dodona-${{ matrix.image }}.dockerfile
        push: true
        platforms: 'linux/amd64'
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Runs the consumer judge on the exact candidate image promote.yml will stage.
  # TODO: point the ref at @main once judge-html#289 is merged.
  e2e-judge-html:
    needs: [detect, build]
    if: ${{ github.event_name == 'pull_request' && contains(fromJson(needs.detect.outputs.images), 'html') }}
    permissions:
      contents: read
      packages: read
    uses: dodona-edu/judge-html/.github/workflows/e2e.yml@enhancement/image-owned-deps-spike
    with:
      image: ghcr.io/${{ github.repository_owner }}/dodona-html:pr-${{ github.event.pull_request.number }}
