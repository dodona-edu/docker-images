name: Lint

on: [push]

permissions:
  contents: read

jobs:
  # A matrix cannot read a file, so the image list comes from a job.
  images:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: images
        run: echo "images=$(yq -o=json -I0 '.' images.yml)" >> "$GITHUB_OUTPUT"

  lint:
    needs: images
    name: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.images.outputs.images) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jbergstroem/hadolint-gh-action@v1
        with:
          dockerfile: dodona-${{ matrix.image }}.dockerfile
          error_level: 1
          config_file: hadolint.yml
