version: 2
updates:
- package-ecosystem: docker
  directory: "/"
  target-branch: dev
  schedule:
    interval: monthly
    time: "13:00"
    timezone: Europe/Brussels
  open-pull-requests-limit: 99
  ignore:
  - dependency-name: node
    versions:
    - ">= 15.a"
    - "< 16"
  - dependency-name: openjdk
    versions:
    - ">= 13.a"
    - "< 14"
  - dependency-name: openjdk
    versions:
    - ">= 14.a"
    - "< 15"
  - dependency-name: swipl
    versions:
    - ">= 8.1.a"
    - "< 8.2"
# One requirements.txt per image, so a bump gets verified against the candidate image.
- package-ecosystem: pip
  directories:
  - "/dodona-*"
  target-branch: dev
  schedule:
    interval: monthly
    time: "13:00"
    timezone: Europe/Brussels
  open-pull-requests-limit: 99
- package-ecosystem: github-actions
  directory: "/"
  target-branch: dev
  schedule:
    interval: weekly
    day: monday
    time: "04:00"
    timezone: Europe/Brussels
  open-pull-requests-limit: 99
