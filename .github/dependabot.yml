- package-ecosystem: pip
  directory: "/dodona-python"
  schedule:
    interval: monthly
    time: "13:00"
    timezone: Europe/Brussels
  open-pull-requests-limit: 99
  groups:
    dodona-python:
      patterns:
      - "*"
- package-ecosystem: pip
  directory: "/dodona-sqlite"
  schedule:
    interval: monthly
    time: "13:00"
    timezone: Europe/Brussels
  open-pull-requests-limit: 99
  groups:
    dodona-sqlite:
      patterns:
      - "*"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    day: monday
    time: "04:00"
    timezone: Europe/Brussels
  open-pull-requests-limit: 99
