version: 2
updates:
- package-ecosystem: docker
  directory: "/"
  schedule:
    interval: monthly
    time: "13:00"
    timezone: Europe/Brussels
  open-pull-requests-limit: 99
  ignore:
  - dependency-name: node
    versions:
    - ">= 15.a"
    - "< 16"
  - dependency-name: openjdk
    versions:
    - ">= 13.a"
    - "< 14"
  - dependency-name: openjdk
    versions:
    - ">= 14.a"
    - "< 15"
  - dependency-name: swipl
    versions:
    - ">= 8.1.a"
    - "< 8.2"
  - dependency-name: haskell
    versions:
    - ">= 9.13"
# One entry per image, so each image's bumps arrive as one PR, verified against that image's candidate build.
- package-ecosystem: pip
  directory: "/dodona-assembly"
  schedule:
    interval: monthly
    time: "13:00"
    timezone: Europe/Brussels
  open-pull-requests-limit: 99
  groups:
    dodona-assembly:
      patterns:
      - "*"
- package-ecosystem: pip
  directory: "/dodona-bash"
  schedule:
    interval: monthly
    time: "13:00"
    timezone: Europe/Brussels
  open-pull-requests-limit: 99
  groups:
